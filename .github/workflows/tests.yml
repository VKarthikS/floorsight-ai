name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/flask-gemini/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: apps/flask-gemini
